# ====================================================================
# Cloudflare Pages Configuration: IDEA HOME / Arasteh Industrial
# Pages + Functions + KV + ImageKit
# ====================================================================

name = "ideahome-production"

compatibility_date = "2026-09-22"

# خروجی Vite
pages_build_output_dir = "dist"


# ------------------------------------------------------------
# Environment Variables
# ------------------------------------------------------------

[vars]

ENVIRONMENT = "production"


# ------------------------------------------------------------
# Cloudflare KV Storage
# ------------------------------------------------------------

[[kv_namespaces]]

binding = "KV"

id = "815c294b7bb74dc1997fb51a914c0d6d"


# ------------------------------------------------------------
# Secrets are NOT stored here
#
# Add them from Cloudflare Dashboard:
#
# ADMIN_USERNAME
# ADMIN_PASSWORD
# JWT_SECRET
# IMAGEKIT_PUBLIC_KEY
# IMAGEKIT_PRIVATE_KEY
# IMAGEKIT_URL_ENDPOINT
#
# ------------------------------------------------------------
