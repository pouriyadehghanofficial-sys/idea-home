# ====================================================================
# Cloudflare Pages Configuration: IDEA HOME / Arasteh Industrial
# Native Serverless Edge Stack (Pages + Functions + D1 + R2)
# ====================================================================

name = "ideahome-production"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"


# 2. Media Storage: ImageKit Signed Direct Uploads
# The application uploads media assets directly to ImageKit Media Library using HMAC-SHA1 signatures.
# Assets are served globally from ImageKit CDN.
# Configure ImageKit credentials via Wrangler CLI or Cloudflare Dashboard:
#   npx wrangler pages secret put IMAGEKIT_PUBLIC_KEY
#   npx wrangler pages secret put IMAGEKIT_PRIVATE_KEY
#   npx wrangler pages secret put IMAGEKIT_URL_ENDPOINT

# 3. Environment Variables (Non-sensitive)
[vars]
ENVIRONMENT = "production"

# Note on Secrets:
# Sensitive credentials MUST NOT be stored in this file.
# Set them in Cloudflare Dashboard or via Wrangler CLI:
#   npx wrangler pages secret put ADMIN_USERNAME
#   npx wrangler pages secret put ADMIN_PASSWORD
#   npx wrangler pages secret put JWT_SECRET
#   npx wrangler pages secret put IMAGEKIT_PUBLIC_KEY
#   npx wrangler pages secret put IMAGEKIT_PRIVATE_KEY
#   npx wrangler pages secret put IMAGEKIT_URL_ENDPOINT

# 4. Persistent Cloud Storage: Cloudflare KV
[[kv_namespaces]]
binding = "KV"
id = "815c294b7bb74dc1997fb51a914c0d6d"