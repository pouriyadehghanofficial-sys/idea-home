    <!-- Shield against third-party Web3 wallet extensions (MetaMask, Coinbase, Phantom, etc.) injection collisions -->
    <script>
      (function() {
        try {
          window.addEventListener('error', function(event) {
            if (event && event.message && typeof event.message === 'string' && event.message.includes('ethereum')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                return origDefineProperty.call(Object, obj, prop, {
                  ...descriptor,
                  configurable: true,
                  writable: true
                });
              } catch (err) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            return origDefineProperty.apply(Object, arguments);
          };
        } catch (_) {}
      })();
    </script>
